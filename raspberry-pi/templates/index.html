<!DOCTYPE html>
<html>
<head>
  <title>Smart Gate Dashboard (B5)</title>
  <meta http-equiv="refresh" content="3">
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: Arial, sans-serif; padding: 30px; }
    h1 { color: #58a6ff; font-size: 22px; margin-bottom: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .card h2 { font-size: 13px; color: #8b949e; text-transform: uppercase; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 15px; }
    .green { color: #3fb950; } .red { color: #f85149; } .yellow { color: #d29922; } .gray { color: #8b949e; }
    .spots-bar-bg { background: #30363d; border-radius: 6px; height: 12px; margin-top: 10px; overflow: hidden; }
    .spots-bar-fill { background: #3fb950; height: 100%; border-radius: 6px; }
    .btn { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 14px; }
    .btn-entry { background: #238636; color: #fff; }
    .footer { font-size: 11px; color: #484f58; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Smart Gate Dashboard <span style="font-size:13px; color:#8b949e;">(B5)</span></h1>

  <div class="card">
    <h2>Parking Spots</h2>
    <div class="row"><span>Available</span><span class="green">{{ status.spots_available }} / {{ status.spots_total }}</span></div>
    <div class="spots-bar-bg">
      <div class="spots-bar-fill" style="width: {{ (status.spots_available / status.spots_total * 100) | round }}%;"></div>
    </div>
  </div>

  <div class="card">
    <h2>Gate</h2>
    <a href="/open_entry" class="btn btn-entry">Open Entry</a>
  </div>

  <div class="footer">Auto-refreshes every 3s</div>

</body>
</html>
